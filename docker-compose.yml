version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: koko-maya-db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: koko_maya
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/api/src/db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql
      - ./apps/api/src/db/seed.sql:/docker-entrypoint-initdb.d/20-seed.sql

  redis:
    image: redis:7-alpine
    container_name: koko-maya-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
